name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "llms.txt"
      - "scabase-fetcher/data/**"
      - "scabase-fetcher/scripts/gen_data_index.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 数据工作流可能在几分钟内连续提交（例如软件 / 社区健康度各提交一次），
  # cancel-in-progress: true 会让后来的部署取消前一个，被取消的那个记为 failure
  #（现象：Deploy to GitHub Pages failure，站点其实被最新一份覆盖了）。
  # 改为排队串行：多等十几秒，但每次部署都有明确成功结论。
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/scabase-fetcher/data
          cp index.html _site/
          cp -r assets _site/ 2>/dev/null || true
          cp CNAME _site/ 2>/dev/null || true
          cp llms.txt _site/ 2>/dev/null || true
          cp scabase-fetcher/data/vulns.json _site/scabase-fetcher/data/ 2>/dev/null || true
          cp scabase-fetcher/data/pkg_list.txt _site/scabase-fetcher/data/ 2>/dev/null || true
          cp scabase-fetcher/data/pkg_list_popular.txt _site/scabase-fetcher/data/ 2>/dev/null || true
          cp scabase-fetcher/data/community-support.json _site/scabase-fetcher/data/ 2>/dev/null || true
          cp scabase-fetcher/data/popular-packages.json _site/scabase-fetcher/data/ 2>/dev/null || true
          cp scabase-fetcher/data/repo-map.json _site/scabase-fetcher/data/ 2>/dev/null || true
          cp scabase-fetcher/data/software-vulns.json _site/scabase-fetcher/data/ 2>/dev/null || true
          cp scabase-fetcher/data/software-support.json _site/scabase-fetcher/data/ 2>/dev/null || true
          # 机器可读数据索引（LLM WebFetch 入口）：构建时重新生成，
          # 字节数与 sha256 与实际发布产物保持一致
          python3 scabase-fetcher/scripts/gen_data_index.py \
            --data scabase-fetcher/data \
            --out _site/scabase-fetcher/data/index.json \
            --base-url "https://scabase.roweb.cn"
          # 给静态资源 URL 附加内容版本号。
          # GitHub Pages 对 .js/.css 缓存 4 小时（max-age=14400），而 index.html 只缓存
          # 10 分钟（max-age=600）。两者缓存周期不一致时，部署后浏览器会拿到「新页面 +
          # 旧脚本」，表现为 tab 切换等交互点了没反应。按资源内容哈希加版本号后，
          # HTML 一更新就会拉取匹配的脚本/样式。
          ASSET_VERSION="$(cat assets/app.js assets/style.css assets/config.js | sha256sum | cut -c1-10)"
          sed -i -E 's#(assets/(app\.js|style\.css|config\.js))#\1?v='"${ASSET_VERSION}"'#g' _site/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 数据工作流可能相隔几十秒连续提交，两个部署同时写 github-pages
      # environment 会互相抢占，被打断的那个记为 failure（重试即可成功）
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # 上一次部署刚触发的 Pages 构建可能仍在进行，立刻重试同样会撞上
      # 「Concurrent requests limit exceeded / deployment already in progress」
      - name: 等待 Pages 环境空闲
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Retry deploy（并发抢占时重试一次）
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # 部署动作本身争的是 Pages 环境，失败时站点往往已被另一个实例更新；
      # 这里只在两次都失败时才判负，避免「站点是新的、徽章是红的」。
      - name: 汇总部署结论
        if: always()
        run: |
          if [ "${{ steps.deployment.outcome }}" = "failure" ] \
             && [ "${{ steps.retry.outcome }}" = "failure" ]; then
            echo "两次部署均失败，请查看 Actions 运行记录" >&2
            exit 1
          fi
          echo "站点地址：${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}"
