name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "scabase-fetcher/data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/scabase-fetcher/data
          cp index.html _site/
          cp -r assets _site/ 2>/dev/null || true
          cp CNAME _site/ 2>/dev/null || true
          cp scabase-fetcher/data/vulns.json _site/scabase-fetcher/data/ 2>/dev/null || true
          cp scabase-fetcher/data/pkg_list.txt _site/scabase-fetcher/data/ 2>/dev/null || true
          cp scabase-fetcher/data/community-support.json _site/scabase-fetcher/data/ 2>/dev/null || true
          cp scabase-fetcher/data/popular-packages.json _site/scabase-fetcher/data/ 2>/dev/null || true
          # 给静态资源 URL 附加内容版本号。
          # GitHub Pages 对 .js/.css 缓存 4 小时（max-age=14400），而 index.html 只缓存
          # 10 分钟（max-age=600）。两者缓存周期不一致时，部署后浏览器会拿到「新页面 +
          # 旧脚本」，表现为 tab 切换等交互点了没反应。按资源内容哈希加版本号后，
          # HTML 一更新就会拉取匹配的脚本/样式。
          ASSET_VERSION="$(cat assets/app.js assets/style.css assets/config.js | sha256sum | cut -c1-10)"
          sed -i -E 's#(assets/(app\.js|style\.css|config\.js))#\1?v='"${ASSET_VERSION}"'#g' _site/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
