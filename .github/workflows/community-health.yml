name: community-health

# 互联网侧：采集开源组件社区支持力度与活跃度信号 → 写入事实层 → 生成汇总报告
#
# 采集信号（供 oss_intake.community 评分，实际构成记录在 health.json 的 sources 字段）：
#   GitHub API   最近提交、近 12 月发布、贡献者、PR 合并周期、SECURITY.md、
#                 .github/workflows（CI）、archived、星标、背后组织（基金会/厂商/组织/个人）
#   deps.dev     下游依赖项目数、全版本发布时间（→ 近 12 月发布数、最近发布距今天数，
#                 无 GitHub 仓库的 Maven / PyPI / Go 组件的主要节奏信号）
#   npm registry 月下载量、repository 推断仓库、packument 的 maintainers 与发布时间
#                 （无 GitHub 信号时兜底，超 4MB 的大包放弃）
#   PyPI JSON    project_urls / home_page 推断 GitHub 仓库，补全 repo-map 未登记的组件
#
# 任一来源失败只降级，不中断整批任务；未配置 GITHUB_TOKEN 时仍可跑（限流更严格）。
on:
  schedule:
    # 每日 03:17（UTC）执行，与 intake-sync 的 6 小时节奏错开
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      pkg-list:
        description: "组件清单路径（格式 ecosystem|package|version）"
        required: false
        default: "scabase-fetcher/data/pkg_list.txt"
      popular-pkg-list:
        description: "常用依赖清单（四生态各 Top 100），留空则跳过"
        required: false
        default: "scabase-fetcher/data/pkg_list_popular.txt"
      repo-map:
        description: "purl → owner/repo 映射文件"
        required: false
        default: "scabase-fetcher/data/repo-map.json"

permissions:
  # 生成的报告需要提交回仓库（reports/ 为 gitignore 产物，不入库），
  # 由 pages.yml 随 GitHub Pages 一并发布，前端健康度 tab 才能读到数据。
  contents: write

jobs:
  collect-health:
    runs-on: ubuntu-latest
    env:
      POPULAR_LIST: ${{ github.event.inputs.popular-pkg-list || 'scabase-fetcher/data/pkg_list_popular.txt' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install requests

      - name: 生成常用依赖清单（四生态 Top 1000 取前 100）
        # 复用仓库内已校准的 popular-packages.json（离线转换），不在此处联网刷新版本
        run: |
          python scabase-fetcher/scripts/gen_popular_packages.py \
            --json scabase-fetcher/data/popular-packages.json \
            --txt "$POPULAR_LIST"

      - name: 采集社区支持力度与活跃度信号
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_LIST: ${{ github.event.inputs.pkg-list || 'scabase-fetcher/data/pkg_list.txt' }}
          REPO_MAP: ${{ github.event.inputs.repo-map || 'scabase-fetcher/data/repo-map.json' }}
          OUT: scabase-fetcher/data/health-base.json
        run: |
          set -- --pkg-list "$PKG_LIST" --out "$OUT"
          if [ -f "$REPO_MAP" ]; then
            set -- "$@" --repo-map "$REPO_MAP"
          else
            echo "未找到仓库映射 $REPO_MAP，仅使用 deps.dev 与 registry 信号"
          fi
          python scabase-fetcher/scripts/fetch_oss_health.py "$@"

      - name: 采集常用依赖（四生态 Top 100）健康度信号
        # 站点「常用依赖 Top 清单」示例需要在健康度 tab 可查，故一并采集
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_MAP: ${{ github.event.inputs.repo-map || 'scabase-fetcher/data/repo-map.json' }}
          OUT: scabase-fetcher/data/health-popular.json
        run: |
          if [ ! -f "$POPULAR_LIST" ]; then
            echo "未找到常用依赖清单 $POPULAR_LIST，跳过该批采集"
            echo '{}' > "$OUT"
            exit 0
          fi
          set -- --pkg-list "$POPULAR_LIST" --out "$OUT"
          if [ -f "$REPO_MAP" ]; then
            set -- "$@" --repo-map "$REPO_MAP"
          fi
          python scabase-fetcher/scripts/fetch_oss_health.py "$@"

      - name: 合并健康度结果
        run: |
          python - <<'PY'
          import json
          import os

          base_path = "scabase-fetcher/data/health-base.json"
          popular_path = "scabase-fetcher/data/health-popular.json"
          out_path = "scabase-fetcher/data/health.json"

          merged = {}
          for path in (base_path, popular_path):
              if not os.path.exists(path):
                  print("跳过不存在的 %s" % path)
                  continue
              with open(path, "r", encoding="utf-8") as handle:
                  payload = json.load(handle)
              for key, value in payload.items():
                  # 基础清单优先：命中同一 purl 时保留先到的更详细记录
                  merged.setdefault(key, value)
          with open(out_path, "w", encoding="utf-8") as handle:
              json.dump(merged, handle, ensure_ascii=False, indent=2)
          print("merged components: %d" % len(merged))
          PY

      - name: 校验采集结果非空
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          path = "scabase-fetcher/data/health.json"
          if not os.path.exists(path):
              print("缺少 %s，采集步骤未产出结果" % path, file=sys.stderr)
              sys.exit(1)
          with open(path, "r", encoding="utf-8") as handle:
              data = json.load(handle)
          usable = sum(1 for v in data.values()
                       if isinstance(v, dict) and not v.get("health_unknown"))
          print("components:", len(data), "usable:", usable)
          sys.exit(0 if data else 1)
          PY

      - name: 生成社区支持力度汇总报告
        # JSON 报告提交到受版本管理的 data 目录（前端 HEALTH_URL 读取），
        # Markdown 仍留在 reports/ 仅用于 Step Summary 与 artifact。
        run: |
          mkdir -p reports
          python scabase-fetcher/scripts/community_report.py \
            --health scabase-fetcher/data/health.json \
            --md reports/community-support.md \
            --json scabase-fetcher/data/community-support.json

      - name: 写入事实层（health 数据集）
        # 仅刷新 health 水位；--license 传空表示本轮不处理许可证，避免把未采集的数据集标记为新鲜
        run: |
          python scabase-fetcher/scripts/build_facts.py \
            --facts scabase-fetcher/data/facts \
            --health scabase-fetcher/data/health.json \
            --license ""

      - name: 测试门禁
        run: python -m unittest discover -s tests

      - name: 上传健康度与社区支持力度产物
        uses: actions/upload-artifact@v4
        with:
          name: scabase-community-health
          path: |
            scabase-fetcher/data/health.json
            scabase-fetcher/data/community-support.json
            reports/community-support.md
          if-no-files-found: warn

      - name: 汇总到 Step Summary
        if: always()
        run: |
          if [ -f reports/community-support.md ]; then
            {
              echo "### 社区支持力度与活跃度采集"
              echo
              cat reports/community-support.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 提交报告（发布到 GitHub Pages）
        # JSON 报告随仓库发布，pages.yml 把它复制进 _site，健康度 tab 才有数据；
        # data/** 变更会自动触发 pages.yml 重新部署。
        run: |
          # 同步刷新机器可读索引（LLM WebFetch 入口）：字节数与 sha256 随数据落地
          python3 scabase-fetcher/scripts/gen_data_index.py \
            --data scabase-fetcher/data \
            --out scabase-fetcher/data/index.json \
            --base-url "https://scabase.roweb.cn"
          if [ -z "$(git status --porcelain scabase-fetcher/data/community-support.json)" ]; then
            # 报告无变化：撤销索引的时间戳刷新，避免每日空提交
            git checkout -- scabase-fetcher/data/index.json
            echo "报告无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scabase-fetcher/data/community-support.json \
                  scabase-fetcher/data/index.json
          git commit -m "chore(data): update community-support.json"
          git push
