name: software-collect

# 互联网侧：采集常用应用 / 基础设施软件（nginx / 7-Zip / Kubernetes 等）的
# 漏洞与健康度信号，提交回 data/ 目录，由 pages.yml 随站点发布。
#
# 数据源：
#   NVD CVE API 2.0  keywordSearch 拉取候选 + 本地 CPE vendor:product 精确过滤
#                    （提取 CVSS、影响版本区间、CWE、参考链接）
#   GitHub API       仓库健康度全量信号（Star、最近提交、近 12 月发布、
#                    维护者/贡献者、PR 合并周期、安全策略、CI、背后组织），
#                    版本号取最新 Release，无 Release 回退 tags
#
# NVD 无 API key 时限流 5 次 / 30 秒（脚本内置 6.5s 间隔，全量约 8 分钟）；
# 配置仓库 Secret NVD_API_KEY 后自动提速。GitHub 用默认 GITHUB_TOKEN。
# 任一来源失败只降级，不中断整批。
#
# 排期注意（踩过坑）：GitHub 配额是 **每小时窗口**，community-health 在 03:17
# 开跑会打满当小时的 1000 次配额；原定的 03:43 落在同一窗口内，于是软件维度
# 大面积降级——65 个软件只有 23 个采到 stars、0 个 forks/watchers。
# 现改为 05:43（跨过一个配额窗口），并在采集器里「睡到 X-RateLimit-Reset」。
on:
  schedule:
    # 每日 05:43（UTC）：与 community-health（03:17）跨窗口错开
    - cron: "43 5 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "只采集指定软件（空格分隔，按名称或别名），留空为全量"
        required: false
        default: ""
      skip-vulns:
        description: "true 时跳过 NVD、只刷 GitHub 健康度信号"
        required: false
        default: "false"

permissions:
  # 采集结果需要提交回仓库，pages.yml 才能随站点发布
  contents: write

concurrency:
  # 串行执行：并发实例互抢 GitHub 配额且容易在提交时撞车（详见 push 段注释）
  group: software-collect
  cancel-in-progress: false

jobs:
  collect-software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install requests

      - name: 采集软件漏洞与健康度
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -- --refresh
          if [ "${{ github.event.inputs.skip-vulns }}" = "true" ]; then
            set -- "$@" --no-vulns
          fi
          if [ -n "${{ github.event.inputs.only }}" ]; then
            for name in ${{ github.event.inputs.only }}; do
              set -- "$@" --only "$name"
            done
          fi
          python scabase-fetcher/scripts/fetch_software.py "$@"

      - name: 校验 GitHub 信号覆盖率
        # 限流会让软件静默降级成「未知」，没有这层门禁时一轮白跑也无人察觉
        run: |
          python - <<'PY'
          import json
          import sys

          with open("scabase-fetcher/data/software-support.json", encoding="utf-8") as handle:
              rows = json.load(handle)["components"]
          with_repo = [r for r in rows if r.get("repo")]
          got = [r for r in with_repo if r.get("forks") is not None]
          ratio = len(got) / max(1, len(with_repo))
          print("登记仓库 %d 个，forks 覆盖 %d 个（%.0f%%）" % (len(with_repo), len(got), ratio * 100))
          if with_repo and ratio < 0.9:
              print("GitHub 信号覆盖率过低（疑似限流），本次不覆盖旧数据", file=sys.stderr)
              sys.exit(1)
          PY

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 同步刷新机器可读索引（LLM WebFetch 入口）：字节数与 sha256 随数据落地
          python3 scabase-fetcher/scripts/gen_data_index.py \
            --data scabase-fetcher/data \
            --out scabase-fetcher/data/index.json \
            --base-url "https://scabase.roweb.cn"
          if [ -z "$(git status --porcelain scabase-fetcher/data/software-vulns.json scabase-fetcher/data/software-support.json)" ]; then
            # 数据无变化：撤销索引的时间戳刷新，避免每日空提交
            git checkout -- scabase-fetcher/data/index.json
            echo "数据无变化"
            exit 0
          fi
          # 并发提交时不用 rebase：data 文件每轮整体重算，与远端同一文件必然冲突。
          # 改为把本地数据直接落到远端最新提交之上（reset --mixed 只动 HEAD 与暂存区），
          # 这样 push 一定是 fast-forward，不会丢掉整轮采集结果。
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed FETCH_HEAD
            git add scabase-fetcher/data/software-vulns.json \
                    scabase-fetcher/data/software-support.json \
                    scabase-fetcher/data/index.json
            if git diff --cached --quiet; then
              echo "远端已是同样数据，跳过提交"
              exit 0
            fi
            git commit -m "chore(data): update software vulns & support"
            if git push origin main; then exit 0; fi
            echo "push 被拒（第 $attempt 次），20 秒后重试…"
            sleep 20
          done
          echo "push 连续失败：请查看 Actions 运行记录是否有并发提交" >&2
          exit 1
