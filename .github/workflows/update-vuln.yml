name: Update Vulnerability Data

on:
  schedule:
    # 每天 02:00 UTC 自动更新
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      no_nvd:
        description: "仅抓取 OSV，跳过 NVD"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-vuln
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Fetch OSV / NVD data
        working-directory: scabase-fetcher
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.no_nvd }}" = "true" ]; then
            python scripts/fetch_osv_nvd.py --no-nvd
          else
            python scripts/fetch_osv_nvd.py
          fi

      - name: Commit and push changes
        run: |
          # 同步刷新机器可读索引（LLM WebFetch 入口）：字节数与 sha256 随数据落地
          python3 scabase-fetcher/scripts/gen_data_index.py \
            --data scabase-fetcher/data \
            --out scabase-fetcher/data/index.json \
            --base-url "https://scabase.roweb.cn"
          if [ -z "$(git status --porcelain scabase-fetcher/data/vulns.json)" ]; then
            # 数据无变化：撤销索引的时间戳刷新，避免每日空提交
            git checkout -- scabase-fetcher/data/index.json
            echo "漏洞数据无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scabase-fetcher/data/vulns.json \
                  scabase-fetcher/data/index.json
          git commit -m "chore(data): update vulns.json"
          # 数据工作流可能并发提交（曾与 community-health 撞车导致 push 被拒，
          # 整轮采集结果丢失）：push 先 rebase，冲突重算索引后再续，失败自动重试
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase FETCH_HEAD; then
              git checkout FETCH_HEAD -- scabase-fetcher/data/index.json
              python3 scabase-fetcher/scripts/gen_data_index.py \
                --data scabase-fetcher/data \
                --out scabase-fetcher/data/index.json \
                --base-url "https://scabase.roweb.cn"
              git add scabase-fetcher/data/index.json
              GIT_EDITOR=true git rebase --continue
            fi
            if git push origin main; then exit 0; fi
            echo "push 被拒（第 $attempt 次），20 秒后重试…"
            sleep 20
          done
          echo "push 连续失败：请查看 Actions 运行记录是否有并发提交" >&2
          exit 1
